[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmstudio-agent-mcp"
version = "1.2.1"
description = "MCP server providing agent capabilities for LM Studio: file I/O, terminal execution, web search, persistent memory, and skill loading."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "oemoem12" }]
keywords = [
    "mcp",
    "lmstudio",
    "model-context-protocol",
    "agent",
    "file-io",
    "terminal",
    "web-search",
    "memory",
    "skills",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.0",
    "httpx>=0.25",
    "beautifulsoup4>=4.12",
]

[project.urls]
Homepage = "https://github.com/oemoem12/lmstudio-agent-mcp"
Repository = "https://github.com/oemoem12/lmstudio-agent-mcp.git"
Issues = "https://github.com/oemoem12/lmstudio-agent-mcp/issues"

[project.scripts]
lmstudio-agent-mcp = "lmstudio_agent_mcp.cli:main"
lmstudio-mcp-config = "lmstudio_agent_mcp.cli:config_main"
lmstudio-mcp-setup = "lmstudio_agent_mcp.cli:setup_main"

[tool.setuptools]
package-dir = { "" = "src" }
cmdclass = { install = "lmstudio_agent_mcp._install_hook.PostInstallCommand" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["lmstudio_agent_mcp*"]

[tool.setuptools.package-data]
lmstudio_agent_mcp = ["py.typed"]
